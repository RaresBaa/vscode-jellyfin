name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi

      - run: npm ci

      - run: npm run check-types

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --out "vscode-jellyfin-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "vscode-jellyfin-${GITHUB_REF_NAME}.vsix" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
